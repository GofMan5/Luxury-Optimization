name: Bug report
description: Report a reproducible failure or incorrect result
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `Luxury-Optimization ... version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, Linux, Other]
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Architecture
      placeholder: amd64, arm64, or 386
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact command and minimal steps. Remove usernames, paths, tokens and other private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This report contains no credentials or private machine data.
          required: true
        - label: This is not a vulnerability report; security issues use a private advisory.
          required: true
