name: Release

on:
  push:
    tags: ["v1.0.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v1\.0\.[0-9]+$ ]] || { echo "release must stay in 1.0.x"; exit 1; }
      - name: Build and verify
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh "${GITHUB_REF_NAME#v}"
          go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          ./dist/Luxury-Optimization-linux-amd64 version | grep -F "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Luxury-Optimization-windows-amd64.exe \
            dist/Luxury-Optimization-windows-arm64.exe \
            dist/Luxury-Optimization-windows-386.exe \
            dist/Luxury-Optimization-linux-amd64 \
            dist/Luxury-Optimization-linux-arm64 \
            dist/SHA256SUMS.txt \
            --verify-tag --generate-notes --title "Luxury Optimization ${GITHUB_REF_NAME#v}"
