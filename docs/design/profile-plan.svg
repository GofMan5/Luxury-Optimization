<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Luxury Optimization profile plan concept</title>
  <desc id="desc">A detailed exact-change plan with supported settings, warnings, verification chain and apply confirmation.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06070a"/><stop offset="1" stop-color="#101620"/></linearGradient><linearGradient id="gold"><stop stop-color="#f4e2a8"/><stop offset=".5" stop-color="#d7b665"/><stop offset="1" stop-color="#a7792d"/></linearGradient></defs>
  <rect width="1600" height="1000" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1598" height="998" rx="23" fill="none" stroke="#d7b665" stroke-opacity=".38" stroke-width="2"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="24" y="24" width="250" height="952" rx="20" fill="#090c11" stroke="#d7b665" stroke-opacity=".18"/>
    <circle cx="72" cy="76" r="25" fill="none" stroke="url(#gold)" stroke-width="3"/><path d="M62 61v29h20" fill="none" stroke="url(#gold)" stroke-width="6"/><text x="110" y="70" fill="#f5f1e7" font-size="18" font-weight="700">Luxury</text><text x="110" y="91" fill="#d7b665" font-size="13" letter-spacing="2">OPTIMIZATION</text>
    <g transform="translate(44 152)"><rect width="206" height="48" rx="12" fill="#d7b665" fill-opacity=".12"/><rect width="3" height="48" rx="2" fill="#d7b665"/><text x="50" y="30" fill="#f1e9d5" font-size="15" font-weight="650">Profiles</text></g>
    <g fill="#8893a2" font-size="15"><text x="94" y="242">Overview</text><text x="94" y="290">Games</text><text x="94" y="338">Startup</text><text x="94" y="386">Services</text><text x="94" y="434">Network</text><text x="94" y="482">Benchmarks</text><text x="94" y="530">Restore</text><text x="94" y="578">Updates</text></g>
    <g transform="translate(306 40)">
      <text x="0" y="30" fill="#f5f1e7" font-size="26" font-weight="700">Recommended profile</text><text x="0" y="57" fill="#7f8996" font-size="14">Exact changes for this machine. Nothing is applied until confirmation.</text>
      <g transform="translate(0 91)"><rect width="1244" height="86" rx="18" fill="#0d1118" stroke="#d7b665" stroke-opacity=".22"/><text x="28" y="35" fill="#f5f1e7" font-size="17" font-weight="650">8 of 10 targets already match</text><text x="28" y="62" fill="#8d98a5" font-size="13">2 user-scoped settings will change · backup and read-back are required</text><text x="1184" y="52" text-anchor="end" fill="#d7b665" font-size="26" font-weight="720">2 changes</text></g>
      <g transform="translate(0 203)">
        <rect width="890" height="570" rx="20" fill="#0b0f15" stroke="#fff" stroke-opacity=".07"/>
        <text x="28" y="43" fill="#7f8996" font-size="12" letter-spacing="1.5">SETTING</text><text x="490" y="43" fill="#7f8996" font-size="12" letter-spacing="1.5">CURRENT</text><text x="682" y="43" fill="#7f8996" font-size="12" letter-spacing="1.5">TARGET</text><text x="844" y="43" text-anchor="end" fill="#7f8996" font-size="12" letter-spacing="1.5">STATE</text>
        <line x1="28" y1="62" x2="862" y2="62" stroke="#fff" stroke-opacity=".08"/>
        <g font-size="14"><text x="28" y="101" fill="#e0e5ec" font-weight="600">Windows Game Mode</text><text x="28" y="124" fill="#76818e" font-size="12">Gaming · HKCU</text><text x="490" y="112" fill="#a9b2bd">Enabled</text><text x="682" y="112" fill="#a9b2bd">Enabled</text><text x="844" y="112" text-anchor="end" fill="#63d59f">Matches</text></g>
        <line x1="28" y1="145" x2="862" y2="145" stroke="#fff" stroke-opacity=".06"/>
        <g font-size="14"><text x="28" y="184" fill="#e0e5ec" font-weight="600">Background game capture</text><text x="28" y="207" fill="#76818e" font-size="12">Gaming · HKCU</text><text x="490" y="195" fill="#f0c178">Enabled</text><text x="682" y="195" fill="#d7b665">Disabled</text><text x="844" y="195" text-anchor="end" fill="#ead69c">Change</text></g>
        <line x1="28" y1="228" x2="862" y2="228" stroke="#fff" stroke-opacity=".06"/>
        <g font-size="14"><text x="28" y="267" fill="#e0e5ec" font-weight="600">Mouse acceleration</text><text x="28" y="290" fill="#76818e" font-size="12">Input · registry + live SPI</text><text x="490" y="278" fill="#f0c178">On</text><text x="682" y="278" fill="#d7b665">Off</text><text x="844" y="278" text-anchor="end" fill="#ead69c">Change</text></g>
        <line x1="28" y1="311" x2="862" y2="311" stroke="#fff" stroke-opacity=".06"/>
        <g font-size="14"><text x="28" y="350" fill="#e0e5ec" font-weight="600">Interface transparency</text><text x="28" y="373" fill="#76818e" font-size="12">Desktop · HKCU</text><text x="490" y="361" fill="#a9b2bd">Off</text><text x="682" y="361" fill="#a9b2bd">Off</text><text x="844" y="361" text-anchor="end" fill="#63d59f">Matches</text></g>
        <line x1="28" y1="394" x2="862" y2="394" stroke="#fff" stroke-opacity=".06"/>
        <g font-size="14"><text x="28" y="433" fill="#e0e5ec" font-weight="600">Ethernet interrupt moderation</text><text x="28" y="456" fill="#76818e" font-size="12">Adapter capability</text><text x="490" y="444" fill="#a9b2bd">Unsupported</text><text x="682" y="444" fill="#a9b2bd">Skipped</text><text x="844" y="444" text-anchor="end" fill="#788390">Skip</text></g>
        <line x1="28" y1="477" x2="862" y2="477" stroke="#fff" stroke-opacity=".06"/>
        <text x="28" y="526" fill="#8d98a5" font-size="13">6 additional matching targets are collapsed.</text><text x="840" y="526" text-anchor="end" fill="#d7b665" font-size="13">Show all</text>
      </g>
      <g transform="translate(914 203)"><rect width="330" height="570" rx="20" fill="#0b0f15" stroke="#fff" stroke-opacity=".07"/><text x="26" y="42" fill="#f5f1e7" font-size="18" font-weight="650">Safety chain</text>
        <g transform="translate(27 77)"><circle cx="10" cy="10" r="8" fill="#d7b665"/><text x="34" y="15" fill="#e0e5ec" font-size="14">Create sealed backup</text><line x1="10" y1="26" x2="10" y2="54" stroke="#d7b665" stroke-opacity=".35"/><circle cx="10" cy="70" r="8" fill="#d7b665"/><text x="34" y="75" fill="#e0e5ec" font-size="14">Apply bounded targets</text><line x1="10" y1="86" x2="10" y2="114" stroke="#d7b665" stroke-opacity=".35"/><circle cx="10" cy="130" r="8" fill="#d7b665"/><text x="34" y="135" fill="#e0e5ec" font-size="14">Read back native state</text><line x1="10" y1="146" x2="10" y2="174" stroke="#d7b665" stroke-opacity=".35"/><circle cx="10" cy="190" r="8" fill="#d7b665"/><text x="34" y="195" fill="#e0e5ec" font-size="14">Rollback on any mismatch</text></g>
        <rect x="26" y="314" width="278" height="112" rx="14" fill="#d7b665" fill-opacity=".08" stroke="#d7b665" stroke-opacity=".2"/><text x="46" y="344" fill="#ead69c" font-size="13" font-weight="650">Before applying</text><text x="46" y="372" fill="#9aa5b2" font-size="12">Games should be closed.</text><text x="46" y="394" fill="#9aa5b2" font-size="12">UAC will appear once.</text>
        <text x="26" y="476" fill="#7f8996" font-size="12">Profile</text><text x="304" y="476" text-anchor="end" fill="#dfe4eb" font-size="13">Recommended</text><text x="26" y="510" fill="#7f8996" font-size="12">Scope</text><text x="304" y="510" text-anchor="end" fill="#dfe4eb" font-size="13">Current user</text>
      </g>
      <g transform="translate(0 801)"><rect width="1244" height="102" rx="18" fill="#0a0e14" stroke="#fff" stroke-opacity=".07"/><text x="28" y="42" fill="#cbd2da" font-size="14">No changes have been made.</text><text x="28" y="69" fill="#788390" font-size="12">Applying creates a new restore point and verifies every target.</text><g transform="translate(1010 25)"><rect width="204" height="52" rx="13" fill="url(#gold)"/><text x="102" y="33" text-anchor="middle" fill="#17130b" font-size="15" font-weight="750">Apply 2 changes</text></g></g>
    </g>
  </g>
</svg>
