[package]
name = "luxury-optimization-desktop"
version = "1.0.3"
description = "Measured gaming and system optimization desktop app"
authors = ["GofMan5"]
license = "MIT"
repository = "https://github.com/GofMan5/Luxury-Optimization"
edition = "2024"
rust-version = "1.88"

[lib]
name = "luxury_optimization_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.10.1"
